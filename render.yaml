services:
  - type: web
    name: neurohub-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: cohere
      - key: EMBEDDING_MODEL
        value: embed-english-v3.0
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: TOP_K
        value: "7"
      - key: TEMPERATURE
        value: "0.3"
      - key: MAX_TOKENS
        value: "300"