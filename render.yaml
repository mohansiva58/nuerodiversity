services:
  - type: web
    name: neurohub-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: OLLAMA_MODEL
        value: mistral
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: TOP_K
        value: "7"
      - key: TEMPERATURE
        value: "0.3"
      - key: MAX_TOKENS
        value: "300"